{% extends "base.html" %}
{% block title %}Bestellansicht{% endblock %}
{% block content %}
<h2>Bestellung aufgeben</h2>
{% if message %}<div class="alert">{{ message }}</div>{% endif %}
<form method="post" class="form-grid">
  <label for="product_id">Produkt</label>
  <select name="product_id" id="product_id">
    {% for product in products.values() %}
    <option value="{{ product.id }}">{{ product.name }} ({{ product.quantity }} verfügbar)</option>
    {% endfor %}
  </select>

  <label for="quantity">Menge</label>
  <input type="number" id="quantity" name="quantity" value="1" min="1" required />

  <button class="btn" type="submit">Bestellung abschicken</button>
</form>
{% endblock %}
